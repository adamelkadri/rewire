[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rewire"
version = "0.1.0"
description = "Autonomous API migration and code-maintenance agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adam Elkadri", email = "adamelkadri2@gmail.com" }]
keywords = ["llm", "agent", "api-migration", "static-analysis", "codemod"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
]

dependencies = [
  "anthropic>=0.40",
  "openai>=1.50",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "rich>=13.8",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6.9",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-pyyaml>=6.0",
]

[project.scripts]
rewire = "rewire.cli:main"

[project.urls]
Homepage = "https://github.com/adamelkadri/rewire"
Documentation = "https://github.com/adamelkadri/rewire/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/rewire"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: tests that touch the filesystem, Docker, Git or the network",
  "slow: tests that take more than a couple of seconds",
  "llm: tests that require a live LLM provider (never run in CI by default)",
]
filterwarnings = ["error"]

# ------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/rewire"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

# ----------------------------------------------------------------- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixture and benchmark repositories are input *data*: Rewire analyses them, it
# does not own them. They deliberately contain unparseable files, bare prints,
# undocumented helpers and decoy code, all of which is the point. Linting them
# would force them to stop resembling the real repositories they stand in for.
extend-exclude = ["tests/fixtures/repos", "evals/datasets"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # flake8-bugbear
  "A",         # flake8-builtins
  "C4",        # flake8-comprehensions
  "DTZ",       # flake8-datetimez
  "T20",       # flake8-print (no stray prints)
  "SIM",       # flake8-simplify
  "PTH",       # flake8-use-pathlib
  "RUF",       # ruff-specific
  "S",         # flake8-bandit
  "ANN",       # flake8-annotations
  "D",         # pydocstyle
]
ignore = [
  "D107",    # missing docstring in __init__ (covered by class docstring)
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "ANN401",  # Any is occasionally the honest type
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, use fake credential literals, run the CLI as a
# subprocess with fixed argv, and need no docstrings.
"tests/**" = ["S101", "S105", "S106", "S603", "D100", "D101", "D102", "D103", "ANN"]
"src/rewire/cli.py" = ["T20"]  # the CLI is allowed to write to stdout via rich/typer

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

# ----------------------------------------------------------------- mypy ----
[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
warn_no_return = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
