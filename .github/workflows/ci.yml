name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ripgrep is an optional dependency, but installing it means CI exercises
      # both search backends and the test asserting they agree, rather than
      # silently skipping eleven tests.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # `uv sync --locked` installs exactly what `uv.lock` pins and fails if the
      # lock is stale. A plain `uv pip install` re-resolves instead, which let
      # CI pick up a newer ruff than the one used locally and fail on formatting
      # nobody could reproduce.
      - name: Create environment
        run: |
          uv python install "${{ matrix.python-version }}"
          uv sync --locked --all-extras --python "${{ matrix.python-version }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      # The matrix is only meaningful if each job really runs its own version.
      # An earlier revision silently ran 3.12 for both, so this is asserted.
      - name: Verify interpreter matches the matrix
        run: |
          python --version
          python -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '${{ matrix.python-version }}', sys.version"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src

      # The sandbox's isolation claims are tested by trying to break out of a
      # real container, so the suite needs a daemon and the image. Pulling it
      # here keeps a slow download out of the first test's time budget, where it
      # would look like a slow test suite.
      - name: Pre-pull the sandbox image
        run: docker pull python:3.12-slim

      - name: Test
        env:
          REWIRE_ENVIRONMENT: ci
          REWIRE_LOG_FORMAT: json
        run: pytest -q --cov=src/rewire --cov-report=term-missing --cov-report=xml

      # The published accuracy figures are a claim; CI has to be able to
      # falsify them. --fail-under turns the benchmark into a gate rather than
      # a number in a README nobody re-runs.
      - name: Benchmark impact analysis
        run: rewire eval impact --no-write --fail-under 1.0

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image broke once before (the docker.io package stopped shipping the
      # client binary), so it is built and its suite is run rather than assumed.
      - name: Build image
        run: docker build -t rewire:ci .

      - name: Run the test suite inside the image
        run: docker run --rm --entrypoint pytest rewire:ci -q

      - name: Check the CLI starts
        run: docker run --rm rewire:ci --version
