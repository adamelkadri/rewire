default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # Fixture specifications are test data: some are deliberately
        # malformed, which is the behaviour they exist to exercise.
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/repos/
      - id: trailing-whitespace
        exclude: ^tests/fixtures/repos/
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^src/
        # The hook runs in its own isolated environment, so every dependency
        # mypy needs to resolve imports must be declared here as well as in
        # pyproject.toml.
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.5
          - structlog>=24.4
          - typer>=0.12
          - types-pyyaml>=6.0

  - repo: local
    hooks:
      - id: pytest
        name: pytest (unit tests)
        entry: pytest tests/unit -q
        language: system
        pass_filenames: false
        types: [python]
