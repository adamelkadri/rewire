default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # Fixture specifications are test data: some are deliberately
        # malformed, which is the behaviour they exist to exercise.
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/repos|evals/datasets)/
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/repos|evals/datasets)/
      - id: mixed-line-ending
      - id: detect-private-key

  # Ruff, mypy and pytest run from the project's own environment rather than
  # from pinned mirror repositories. Mirrors pin their own tool versions
  # independently of `uv.lock`, so a hook could pass locally while CI failed on
  # a newer release -- which is exactly what happened: three different ruff
  # versions were in play at once, and the one pre-commit used did not format
  # Python blocks inside Markdown. Sourcing every tool from `uv.lock` means only
  # one version can exist.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown]
        require_serial: true

      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen mypy src
        language: system
        files: ^src/
        pass_filenames: false

      - id: pytest
        name: pytest (unit tests)
        entry: uv run --frozen pytest tests/unit -q
        language: system
        pass_filenames: false
        types: [python]
